<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Log a Usage Scenario — Tool Usage Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <nav class="tab-bar">
      <a href="submit.html" class="tab-link is-active">
        <svg class="tab-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <rect x="3" y="3" width="14" height="14" rx="3" stroke="currentColor" stroke-width="1.5"/>
          <path d="M10 7v6M7 10h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        Log a usage scenario
      </a>
      <a href="index.html" class="tab-link">
        <svg class="tab-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <rect x="2.5" y="11" width="3.5" height="6.5" rx="1" fill="currentColor"/>
          <rect x="8.25" y="6" width="3.5" height="11.5" rx="1" fill="currentColor"/>
          <rect x="14" y="2.5" width="3.5" height="15" rx="1" fill="currentColor"/>
        </svg>
        Dashboard
      </a>
    </nav>

    <header class="page-header">
      <h1>Log a usage scenario</h1>
      <p class="subtitle">Use this form to enter the details for a usage scenario for tracking purposes.</p>
    </header>

    <section class="chart-card form-card">
      <form id="submit-form" novalidate>
        <div class="form-field">
          <label for="gap-nature">Nature of the gap they want to close</label>
          <select id="gap-nature" name="gap_nature" required>
            <option value="" disabled selected>Choose one…</option>
            <option>Data access / discovery</option>
            <option>Knowledge gap</option>
            <option>Tooling / workflow automation</option>
            <option>Data integration across sources</option>
            <option>Reproducibility</option>
            <option>Standardization / terminology</option>
          </select>
        </div>

        <div class="form-field">
          <label for="query-details">Usage scenario details</label>
          <textarea
            id="query-details"
            name="input_query_details"
            rows="3"
            required
            placeholder="What is this usage scenario trying to find or do?"
          ></textarea>
        </div>

        <div class="form-field">
          <label for="expected-outcome">Expected outcome</label>
          <textarea
            id="expected-outcome"
            name="expected_outcome"
            rows="3"
            required
            placeholder="What would a successful result look like?"
          ></textarea>
        </div>

        <div class="form-field">
          <label for="submitted-by-role">Submitted by role</label>
          <select id="submitted-by-role" name="submitted_by_role" required>
            <option value="" disabled selected>Choose one…</option>
            <option>Researcher</option>
            <option>Data engineer</option>
            <option>Analyst</option>
            <option>PI</option>
            <option>Postdoc</option>
            <option>RA</option>
          </select>
        </div>

        <div class="form-checkbox-field">
          <input type="checkbox" id="confirm-ueic-member" name="confirm_ueic_member" required />
          <label for="confirm-ueic-member">I confirm I am a UEIC member</label>
        </div>

        <div class="form-checkbox-field">
          <input type="checkbox" id="confirm-no-pii" name="confirm_no_pii" required />
          <label for="confirm-no-pii">I confirm this submission contains no personally identifiable information (PII)</label>
        </div>

        <div id="form-message" class="form-message" hidden></div>

        <button type="submit" class="form-submit" disabled>Save</button>
      </form>
    </section>

    <footer class="page-footer">
      <span>Writes to pipeline/sample_data/tracking_sheet.csv via the local dev server — see README.</span>
    </footer>
  </main>

  <script src="submit.js"></script>
</body>
</html>
